name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: llmgui-windows-x64
          - os: ubuntu-latest
            artifact: llmgui-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p llmgui-cli
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\release\llmgui.exe dist\
          copy README.md dist\
          copy CHANGELOG.md dist\
          copy CONTEXT.md dist\
          Compress-Archive -Path dist\* -DestinationPath llmgui-windows-x64.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/llmgui dist/
          cp README.md CHANGELOG.md CONTEXT.md dist/
          tar -czf llmgui-linux-x64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            llmgui-*.zip
            llmgui-*.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            llmgui-*.zip
            llmgui-*.tar.gz
