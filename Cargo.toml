[workspace]
resolver = "2"
members = [
  "crates/llmgui-core",
  "crates/llmgui-models",
  "crates/llmgui-download",
  "crates/llmgui-backend-api",
  "crates/llmgui-backend-mock",
  "crates/llmgui-backend-llamacpp",
  "crates/llmgui-backend-upstream",
  "crates/llmgui-scheduler",
  "crates/llmgui-server",
  "crates/llmgui-cli",
  "crates/llmgui-bench",
  "crates/llmgui-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://example.invalid/llmgui"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
futures-util = "0.3"
hex = "0.4"
llama-cpp-2 = { version = "=0.1.159", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "2.12", features = ["json", "tls"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
