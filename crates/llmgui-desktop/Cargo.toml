[package]
name = "llmgui-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri 2 desktop shell for the llmgui local runtime"

[[bin]]
name = "llmgui-desktop"
path = "src/main.rs"

[dependencies]
clap.workspace = true
llmgui-core = { path = "../llmgui-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
ureq.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile.workspace = true
