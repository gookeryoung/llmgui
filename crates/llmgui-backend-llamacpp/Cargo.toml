[package]
name = "llmgui-backend-llamacpp"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]

[dependencies]
llmgui-core = { path = "../llmgui-core" }
llmgui-backend-api = { path = "../llmgui-backend-api" }
llama-cpp-2 = { workspace = true, optional = true }
llama-cpp-sys-2 = { version = "=0.1.160", default-features = false, optional = true }
tokio.workspace = true
tracing.workspace = true
